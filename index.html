<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>लक्ष्मी पूजा शुभकामना ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: #090817; }
  body { overflow: hidden; font-family: "Noto Sans Devanagari", "Mangal", system-ui, sans-serif; }
  #scene { position: relative; width: 100vw; height: 100svh; min-height: 540px; overflow: hidden; background: #090817; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .message {
    position: absolute; z-index: 3; left: 50%; top: 24%;
    width: min(90%, 720px); transform: translate(-50%, 18px);
    text-align: center; color: #fff3c5; opacity: 0;
    text-shadow: 0 0 9px #ff9d32, 0 0 24px #ff6a20, 0 3px 4px #230d16;
    transition: opacity 2.2s ease, transform 2.2s ease;
    pointer-events: none;
  }
  .message.show { opacity: 1; transform: translate(-50%, 0); }
  .message .wish { font-size: clamp(19px, 4.2vw, 34px); line-height: 1.75; font-weight: 700; }
  .message .heart { display: block; margin-top: 8px; font-size: clamp(22px, 4vw, 34px); }
 
  
  .hint {
    position: absolute; z-index: 4; bottom: 15px; left: 50%; transform: translateX(-50%);
    color: #ffe5a2; font-size: 12px; letter-spacing: .08em; opacity: .75;
    text-shadow: 0 1px 5px #000; white-space: nowrap;
  }
  .replay {
    position: absolute; z-index: 5; right: 14px; bottom: 14px; border: 1px solid #ffd36a;
    background: #29152bd9; color: #ffe9ad; border-radius: 30px; padding: 9px 15px;
    font: inherit; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity .8s;
  }
  .replay.show { opacity: 1; }
  @media (max-width: 600px) {
    .message { top: 19%; width: 92%; }
    .hint { bottom: 14px; font-size: 10px; }
    .replay { bottom: 40px; }
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="art"></canvas>
 
  <div class="message" id="message">
    <div class="wish">लक्ष्मी जस्तै सुन्दर मन भएकी<br>प्रतिमालाई लक्ष्मी पूजाको<br>हार्दिक मंगलमय शुभकामना।</div>
    <span class="heart">❤️ 🪔 🌹</span>
  </div>
  <div class="hint" id="hint">प्रतिमाका लागि विशेष शुभकामना ✨</div>
  <button class="replay" id="replay">↻ फेरि हेर्नुहोस्</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('art'), ctx = canvas.getContext('2d');
  const message = document.getElementById('message');
  const replay = document.getElementById('replay');
  const hint = document.getElementById('hint');
  let W, H, dpr, start, raf, diyas = [], sparks = [], rockets = [], stars = [];
  const rand = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

  function resize() {
    W = canvas.clientWidth; H = canvas.clientHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    makeStars(); makeDiyas();
  }
  function makeStars() {
    stars = Array.from({length: Math.floor(W*H/6500)}, () => ({x:rand(0,W),y:rand(0,H*.43),r:rand(.4,1.4),a:rand(.2,.8)}));
  }
  function makeDiyas() {
    diyas = [];
    // Neat rows of lamps, with a circular ring framing the rangoli.
    const rows = [
      {y:.57, xs:[.13,.25,.38,.5,.62,.75,.87]},
      {y:.67, xs:[.08,.21,.35,.5,.65,.79,.92]},
      {y:.79, xs:[.055,.15,.85,.945]},
      {y:.91, xs:[.07,.19,.31,.43,.57,.69,.81,.93]},
      {y:.985,xs:[.18,.34,.5,.66,.82]}
    ];
    rows.forEach((row,ri) => row.xs.forEach((x,i) => diyas.push({
      x:x*W, y:row.y*H, delay: 4200 + ri*1250 + i*190 + rand(0,450), lit:false,
      size: clamp(W*.025,8,15), phase:rand(0,7)
    })));
    // A ring of small lamps around the mandala.
    for(let i=0;i<24;i++){
      const a=i/24*Math.PI*2;
      diyas.push({x:W*.5+Math.cos(a)*W*.405,y:H*.79+Math.sin(a)*H*.19,
        delay:3900+i*95,lit:false,size:clamp(W*.018,6,11),phase:rand(0,7)});
    }
  }
  function roundedRect(x,y,w,h,r,fill) {
    ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function background(t) {
    const sky=ctx.createLinearGradient(0,0,0,H*.62);
    sky.addColorStop(0,'#080817'); sky.addColorStop(.55,'#21152e'); sky.addColorStop(1,'#a83b24');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=s.a*(.7+.3*Math.sin(t*.001+s.x));ctx.fillStyle='#fff0c4';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;
    // Warm horizon glow
    const glow=ctx.createRadialGradient(W*.5,H*.48,2,W*.5,H*.48,W*.55);
    glow.addColorStop(0,'#ff9b3a55'); glow.addColorStop(1,'#ff4c1600');
    ctx.fillStyle=glow;ctx.fillRect(0,H*.25,W,H*.45);
  }
  function temple() {
    const base=H*.49, scale=Math.min(W/480, H/720);
    ctx.save(); ctx.translate(W/2,base); ctx.scale(scale,scale);
    ctx.fillStyle='#090914';
    // palace base and wings
    ctx.fillRect(-245,-16,490,86);
    ctx.fillRect(-285,10,40,58);ctx.fillRect(245,10,40,58);
    // central temple silhouette
    function dome(x,y,w,h) {
      ctx.beginPath();ctx.moveTo(x-w/2,y+h);ctx.lineTo(x-w/2,y+h*.48);
      ctx.quadraticCurveTo(x-w*.48,y+h*.12,x,y);
      ctx.quadraticCurveTo(x+w*.48,y+h*.12,x+w/2,y+h*.48);
      ctx.lineTo(x+w/2,y+h);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#070711';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-14);ctx.lineTo(x-4,y-8);ctx.moveTo(x,y-14);ctx.lineTo(x+4,y-8);ctx.stroke();
    }
    dome(0,-165,112,150); dome(-78,-104,70,95); dome(78,-104,70,95);
    // tiny side domes
    dome(-205,-44,58,55);dome(205,-44,58,55);
    // golden windows
    for(let x=-220;x<=220;x+=28) {
      roundedRect(x-4,27,8,17,2,'#ffbd4c');
    }
    for(let x=-270;x<=270;x+=22) for(let y=30;y<63;y+=18) {
      if(Math.random()>.45) roundedRect(x,y,4,6,1,'#ffb63e');
    }
    ctx.restore();
  }
  function floor() {
    const top=H*.52;
    const g=ctx.createLinearGradient(0,top,0,H);
    g.addColorStop(0,'#34222a');g.addColorStop(.35,'#8a4a2d');g.addColorStop(1,'#2b1820');
    ctx.fillStyle=g;ctx.fillRect(0,top,W,H-top);
    // perspective tile grid
    ctx.strokeStyle='#170f19aa';ctx.lineWidth=1;
    for(let i=0;i<=12;i++){
      let y=top+(H-top)*Math.pow(i/12,1.65);
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    for(let i=-8;i<=8;i++){
      ctx.beginPath();ctx.moveTo(W/2+i*W*.085,top);ctx.lineTo(W/2+i*W*.23,H);ctx.stroke();
    }
    const sheen=ctx.createLinearGradient(0,top,0,H);
    sheen.addColorStop(0,'#ff9b3320');sheen.addColorStop(1,'#ffb33b00');
    ctx.fillStyle=sheen;ctx.fillRect(0,top,W,H-top);
  }
  function drawPetal(cx,cy,angle,len,w,color) {
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-len/2,w,len/2,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function rangoli(t,progress) {
    if(progress<=0)return;
    const cx=W*.5, cy=H*.79, rx=Math.min(W*.42,H*.24), ry=rx*.55;
    ctx.save();ctx.globalAlpha=progress;
    // Outer circular medallion
    const grad=ctx.createRadialGradient(cx,cy,rx*.08,cx,cy,rx);
    grad.addColorStop(0,'#25102a');grad.addColorStop(.65,'#5c1836');grad.addColorStop(1,'#180d20');
    ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffbf45';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<36;i++){
      const a=i/36*Math.PI*2;
      const x=cx+Math.cos(a)*rx*.88,y=cy+Math.sin(a)*ry*.88;
      ctx.fillStyle=i%2?'#ffe58a':'#ff6339';ctx.beginPath();ctx.arc(x,y,Math.max(1.5,W*.004),0,Math.PI*2);ctx.fill();
      drawPetal(cx+Math.cos(a)*rx*.68,cy+Math.sin(a)*ry*.68,a,rx*.105,rx*.035,i%2?'#ffb52e':'#f34d36');
    }
    ctx.strokeStyle='#ffcf65';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx*.62,ry*.62,0,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<16;i++){
      const a=i/16*Math.PI*2;
      drawPetal(cx,cy,a,rx*.34,rx*.075,i%2?'#ffb42f':'#ef4934');
      drawPetal(cx,cy,a+.19,rx*.25,rx*.045,'#ffdf67');
    }
    ctx.fillStyle='#f7a52e';ctx.beginPath();ctx.arc(cx,cy,rx*.17,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff0a3';ctx.beginPath();ctx.arc(cx,cy,rx*.115,0,Math.PI*2);ctx.fill();
    // central lotus
    for(let i=0;i<8;i++)drawPetal(cx,cy,i*Math.PI/4,rx*.105,rx*.035,'#e94c2e');
    ctx.fillStyle='#ffb92e';ctx.beginPath();ctx.arc(cx,cy,rx*.035,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function drawDiya(d,t) {
    const flicker=.88+.12*Math.sin(t*.012+d.phase);
    const s=d.size, x=d.x,y=d.y;
    // glow
    const glow=ctx.createRadialGradient(x,y-s*.8,1,x,y-s*.8,s*4.8);
    glow.addColorStop(0,'#ffb52c77');glow.addColorStop(1,'#ff8a1600');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y-s*.7,s*4.8,0,Math.PI*2);ctx.fill();
    // clay bowl
    ctx.fillStyle='#a83d16';ctx.beginPath();ctx.ellipse(x,y,s*1.35,s*.48,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f58a26';ctx.beginPath();ctx.ellipse(x,y-s*.12,s*1.12,s*.32,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffcf65';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y-s*.12,s*1.12,s*.32,0,Math.PI,Math.PI*2);ctx.stroke();
    if(d.lit){
      ctx.save();ctx.translate(x,y-s*.35);ctx.scale(flicker,flicker);
      const flame=ctx.createRadialGradient(0,-s*.65,1,0,-s*.55,s*1.05);
      flame.addColorStop(0,'#fffbd1');flame.addColorStop(.3,'#ffe66a');flame.addColorStop(.7,'#ff9d22');flame.addColorStop(1,'#ff571500');
      ctx.fillStyle=flame;ctx.beginPath();ctx.moveTo(0,-s*1.9);
      ctx.bezierCurveTo(s*1.2,-s*.9,s*.8,s*.1,0,s*.55);
      ctx.bezierCurveTo(-s*.8,s*.1,-s*1.2,-s*.9,0,-s*1.9);ctx.fill();ctx.restore();
    }
  }
  function launchFirework() {
    const x=rand(W*.12,W*.88), y=rand(H*.08,H*.29);
    const colors=['#ff4f9a','#ffbd42','#5aa6ff','#ffe6a1','#ff713e'];
    const color=colors[Math.floor(rand(0,colors.length))];
    for(let i=0;i<75;i++){
      const a=Math.PI*2*i/75+rand(-.04,.04), speed=rand(1.1,3.6);
      sparks.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:rand(45,85),max:85,color,size:rand(1,2.5)});
    }
    // a few glittering comet trails
    for(let i=0;i<16;i++)sparks.push({x:x+rand(-12,12),y:y+rand(-12,12),vx:rand(-1,1),vy:rand(-3,-.5),life:rand(35,65),max:65,color:'#fff0b5',size:2});
  }
  function fireworks(t) {
    if(Math.random()<.035)launchFirework();
    rockets=rockets.filter(r=>r.life>0);
    sparks=sparks.filter(p=>p.life>0);
    sparks.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.99;p.life--;
      ctx.globalAlpha=clamp(p.life/p.max,0,1);
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  let lightningUntil=0;
  function lightning(t) {
    if(t>lightningUntil && Math.random()<.0018) lightningUntil=t+110;
    if(t<lightningUntil){
      ctx.fillStyle='rgba(190,205,255,.12)';ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(210,225,255,.9)';ctx.lineWidth=2;
      ctx.beginPath();let x=W*.78,y=0;ctx.moveTo(x,y);
      for(let i=0;i<7;i++){x+=rand(-35,35);y+=H*.045;ctx.lineTo(x,y);}
      ctx.stroke();
    }
  }
  function animate(now) {
    if(!start)start=now;
    const elapsed=now-start;
    ctx.clearRect(0,0,W,H);
    background(now); fireworks(now); lightning(now);
    temple(); floor();
    const rangoliProgress=clamp((elapsed-9000)/6500,0,1);
    rangoli(now,rangoliProgress);
    diyas.forEach(d=>{if(elapsed>d.delay)d.lit=true;drawDiya(d,now);});
    if(elapsed>22000)message.classList.add('show');
    if(elapsed>27000){replay.classList.add('show');hint.style.opacity='.0';}
    raf=requestAnimationFrame(animate);
  }
  function restart(){
    cancelAnimationFrame(raf);start=0;sparks=[];message.classList.remove('show');
    replay.classList.remove('show');hint.style.opacity='.75';
    diyas.forEach(d=>d.lit=false);raf=requestAnimationFrame(animate);
  }
  replay.addEventListener('click',restart);
  window.addEventListener('resize',resize);
  resize();raf=requestAnimationFrame(animate);
})();
</script>
</body>
</html>
